server {
    server_name www.menosclique.com.br;
    root /var/www/menosclique-site;
    index index.html;

    # ── Cabeçalhos de segurança (valem para todas as respostas deste server) ──
    # Atenção: em nginx, add_header dentro de um location SUBSTITUI os do server —
    # por isso os locations abaixo repetem o conjunto.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        # HTML muda a cada artigo publicado: sempre revalidar (ETag/Last-Modified do nginx).
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/index.html $uri.html @blog_fallback;
    }

    # Link de artigo publicado sem o prefixo /blog/ (ex.: /kpis-para-clinicas) → 301 para o artigo.
    location @blog_fallback {
        if (-d $document_root/blog$uri) { return 301 /blog$uri/; }
        return 404;
    }
    error_page 404 /404.html;

    # Assets com hash no nome (_astro/*) e mídias: cache longo e imutável — inclui webp/avif.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Sitemap, feeds, robots, llms.txt: revalidar a cada dia.
    location ~* \.(?:xml|txt)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.menosclique.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.menosclique.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = menosclique.com.br) {
        return 301 https://www.menosclique.com.br$request_uri;
    } # managed by Certbot
    if ($host = www.menosclique.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    listen [::]:80;
    server_name www.menosclique.com.br menosclique.com.br;
    return 404; # managed by Certbot
}
server {
    server_name menosclique.com.br;
    return 301 https://www.menosclique.com.br$request_uri;
    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/www.menosclique.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.menosclique.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
