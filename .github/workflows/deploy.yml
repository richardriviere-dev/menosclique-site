name: Build e Deploy (menosclique-site)

# Toda vez que algo é gravado na branch main (ex.: o VersaAI cria um artigo novo),
# o site é montado e enviado automaticamente para o servidor. Também pode ser
# disparado manualmente na aba "Actions" do GitHub (botão "Run workflow").
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

# Evita dois deploys ao mesmo tempo.
concurrency:
  group: deploy-menosclique
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Montar o site (build)
        run: npm run build

      - name: Preparar a chave de acesso ao servidor
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Identidade do servidor FIXA (chaves publicas, nao sao segredo). Antes ela era
          # perguntada ao servidor a cada deploy (ssh-keyscan); em 11/09/2026 a pergunta ficou
          # 2 minutos sem resposta e o artigo do dia nao foi ao ar. Se o servidor for
          # reinstalado, atualize as 3 linhas abaixo com: ssh-keyscan 179.198.109.50
          cat > ~/.ssh/known_hosts <<'EOF'
          179.198.109.50 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBMlUbLNTV/mSDBYJYEjerR2NKHWS4a1aPPLhkmbue2ihg4TjDF/g6mQkmyD5lIPlsEBgHx1oIW9v38sU90TQ7uk=
          179.198.109.50 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJUUrkIhihVoRFOEcBtJVts7mUKCgD3etSaJ3j+HY4TU
          179.198.109.50 ssh-rsa 
          EOF

      - name: Enviar o site para o servidor
        run: |
          # A rede entre o GitHub e o servidor as vezes cai por alguns minutos.
          # Tenta por ate ~12 minutos antes de desistir (espera 30s, 60s, 90s...).
          for i in 1 2 3 4 5 6; do
            rsync -az --delete --timeout=60 \
              -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
              dist/ root@179.198.109.50:/var/www/menosclique-site/ && exit 0
            echo "envio falhou (tentativa $i); nova tentativa em $((i*30))s..."
            sleep $((i*30))
          done
          exit 1

      # Avisa os buscadores compatíveis com IndexNow (Bing, Yandex e parceiros) sobre todas as URLs.
      - name: Avisar buscadores (IndexNow)
        run: python3 deploy/indexnow.py
